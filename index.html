        ${state.systems.length===0 ? `<div class="no-items">Nenhum sistema ainda. Use o campo acima para criar o primeiro.</div>` : systemCardsFinal}
      </div>
    `;
  }

  // ---------------------------------------------------------------------
  // MODALS
  // ---------------------------------------------------------------------

  function renderModal(){
    let html = '';

    if(modal.type==='newClient' || modal.type==='editClient'){
      const client = modal.payload && modal.payload.clientId ? getClient(modal.payload.clientId) : null;
      const selectedSystems = new Set(client ? (client.systemIds||[]) : []);
      html = `
        <div class="modal">
          <h3>${client ? 'Editar cliente' : 'Novo cliente'}</h3>
          <p class="hint">Todo cliente já recebe a configuração padrão automaticamente. Escolha o segmento para somar os itens específicos dele.</p>
          <div class="field">
            <label>Nome do cliente</label>
            <input type="text" id="modalClientName" value="${client?escapeHtml(client.name):''}" placeholder="Nome da empresa ou cliente">
          </div>
          <div class="field">
            <label>Configuração padrão <span style="text-transform:none;font-weight:400;color:var(--ink-faint);">(aplicada a todos, automaticamente)</span></label>
            <div class="checkbox-list" style="max-height:130px;">
              ${state.standardConfig.length===0
                ? `<div class="empty">Nenhum item padrão cadastrado ainda — crie em Configurações.</div>`
                : state.standardConfig.map(it=>`<div class="empty" style="font-style:normal;color:var(--ink-soft);padding:8px 10px;border-bottom:1px solid rgba(255,255,255,.07);">✓ ${escapeHtml(it.texto)}</div>`).join('')
              }
            </div>
          </div>
          <div class="field">
            <label>Segmento</label>
            <select id="modalClientSegment">
              ${state.segments.map(s=>`<option value="${s.id}" ${client && client.segmentId===s.id?'selected':''}>${escapeHtml(s.name)}</option>`).join('')}
            </select>
          </div>
          <div class="field">
            <label>Sistemas (treinamento)</label>
            <div class="checkbox-list">
              ${state.systems.length===0
                ? `<div class="empty">Nenhum sistema cadastrado ainda — crie um na aba Treinamento.</div>`
                : state.systems.map(s=>`
                    <label>
                      <input type="checkbox" value="${s.id}" ${selectedSystems.has(s.id)?'checked':''} data-modal-system-checkbox>
                      ${escapeHtml(s.name)}
                    </label>
                  `).join('')
              }
            </div>
          </div>
          <div class="field">
            <label>Observações (opcional)</label>
            <input type="text" id="modalClientInfo" value="${client?escapeHtml(client.info||''):''}" placeholder="Telefone, endereço, versão do sistema…">
          </div>
          <div class="modal-actions">
            <button class="btn" id="modalCancel">Cancelar</button>
            <button class="btn btn-primary" id="modalSaveClient">Salvar</button>
          </div>
        </div>
      `;
    } else if(modal.type==='confirmDeleteSegment'){
      const seg = getSegment(modal.payload.segId);
      const count = state.clients.filter(c=>c.segmentId===seg.id).length;
      html = `
        <div class="modal">
          <h3>Excluir "${escapeHtml(seg.name)}"?</h3>
          <p class="hint">${count>0 ? `Isso também excluirá ${count} cliente(s) cadastrado(s) neste segmento, junto com todo o progresso deles. ` : ''}Esta ação não pode ser desfeita.</p>
          <div class="modal-actions">
            <button class="btn" id="modalCancel">Cancelar</button>
            <button class="btn btn-danger" id="modalConfirmDeleteSegment">Excluir</button>
          </div>
        </div>
      `;
    } else if(modal.type==='confirmDeleteSystem'){
      const sys = getSystem(modal.payload.sysId);
      const count = state.clients.filter(c=>(c.systemIds||[]).includes(sys.id)).length;
      html = `
        <div class="modal">
          <h3>Excluir sistema "${escapeHtml(sys.name)}"?</h3>
          <p class="hint">${count>0 ? `${count} cliente(s) têm este sistema marcado — o progresso de treinamento nele será perdido para eles. ` : ''}Esta ação não pode ser desfeita.</p>
          <div class="modal-actions">
            <button class="btn" id="modalCancel">Cancelar</button>
            <button class="btn btn-danger" id="modalConfirmDeleteSystem">Excluir</button>
          </div>
        </div>
      `;
    } else if(modal.type==='confirmDeleteClient'){
      const client = getClient(modal.payload.clientId);
      html = `
        <div class="modal">
          <h3>Excluir "${escapeHtml(client.name)}"?</h3>
          <p class="hint">Todo o progresso de configuração e treinamento deste cliente será perdido. Esta ação não pode ser desfeita.</p>
          <div class="modal-actions">
            <button class="btn" id="modalCancel">Cancelar</button>
            <button class="btn btn-danger" id="modalConfirmDeleteClient">Excluir</button>
          </div>
        </div>
      `;
    }

    let overlay = document.getElementById('modalOverlay');
    if(!overlay){
      overlay = document.createElement('div');
      overlay.id = 'modalOverlay';
      overlay.className = 'modal-overlay';
      document.body.appendChild(overlay);
    }
    overlay.innerHTML = html;
    overlay.style.display = 'flex';

    overlay.querySelector('#modalCancel') && overlay.querySelector('#modalCancel').addEventListener('click', closeModal);
    overlay.addEventListener('click', (e)=>{ if(e.target===overlay) closeModal(); });

    if(modal.type==='newClient' || modal.type==='editClient'){
      if(state.segments.length===0){
        showToast('Crie um segmento antes de cadastrar um cliente.');
        closeModal();
        return;
      }
      overlay.querySelector('#modalSaveClient').addEventListener('click', async ()=>{
        const name = overlay.querySelector('#modalClientName').value.trim();
        const segmentId = overlay.querySelector('#modalClientSegment').value;
        const info = overlay.querySelector('#modalClientInfo').value.trim();
        const systemIds = Array.from(overlay.querySelectorAll('[data-modal-system-checkbox]:checked')).map(cb=>cb.value);
        if(!name){ showToast('Digite o nome do cliente.'); return; }
        if(modal.payload && modal.payload.clientId){
          const c = getClient(modal.payload.clientId);
          c.name = name; c.segmentId = segmentId; c.info = info; c.systemIds = systemIds;
        } else {
          const newClient = {id: uid('cli'), name, segmentId, info, systemIds, checklistConfig:{}, checklistTraining:{}};
          state.clients.push(newClient);
          selectedClientId = newClient.id;
        }
        await persist();
        closeModal();
        render();
      });
    }

    if(modal.type==='confirmDeleteSegment'){
      overlay.querySelector('#modalConfirmDeleteSegment').addEventListener('click', async ()=>{
        const segId = modal.payload.segId;
        state.clients = state.clients.filter(c=>c.segmentId!==segId);
        state.segments = state.segments.filter(s=>s.id!==segId);
        if(selectedClientId && !getClient(selectedClientId)) selectedClientId = null;
        await persist();
        closeModal();
        render();
      });
    }

    if(modal.type==='confirmDeleteSystem'){
      overlay.querySelector('#modalConfirmDeleteSystem').addEventListener('click', async ()=>{
        const sysId = modal.payload.sysId;
        state.systems = state.systems.filter(s=>s.id!==sysId);
        state.clients.forEach(c=>{ c.systemIds = (c.systemIds||[]).filter(id=>id!==sysId); });
        await persist();
        closeModal();
        render();
      });
    }

    if(modal.type==='confirmDeleteClient'){
      overlay.querySelector('#modalConfirmDeleteClient').addEventListener('click', async ()=>{
        state.clients = state.clients.filter(c=>c.id!==modal.payload.clientId);
        if(selectedClientId===modal.payload.clientId) selectedClientId = null;
        await persist();
        closeModal();
        render();
      });
    }
  }

  function closeModal(){
    modal = null;
    const overlay = document.getElementById('modalOverlay');
    if(overlay) overlay.style.display = 'none';
  }

  // ---------------------------------------------------------------------
  // EVENTS
  // ---------------------------------------------------------------------

  function attachEvents(){
    document.querySelectorAll('[data-tab]').forEach(btn=>{
      btn.addEventListener('click', ()=>{ activeTab = btn.getAttribute('data-tab'); render(); });
    });
    document.querySelectorAll('[data-goto-tab]').forEach(btn=>{
      btn.addEventListener('click', ()=>{ activeTab = btn.getAttribute('data-goto-tab'); render(); });
    });

    const btnDownloadBackup = document.getElementById('btnDownloadBackup');
    if(btnDownloadBackup) btnDownloadBackup.addEventListener('click', downloadBackup);
    const btnImportBackup = document.getElementById('btnImportBackup');
    if(btnImportBackup) btnImportBackup.addEventListener('click', triggerImportBackup);

    const clientSearch = document.getElementById('clientSearch');
    if(clientSearch){
      clientSearch.addEventListener('input', (e)=>{
        sidebarFilter = e.target.value;
        render();
        const el = document.getElementById('clientSearch');
        if(el){ el.focus(); el.selectionStart = el.selectionEnd = el.value.length; }
      });
    }
    document.querySelectorAll('[data-client-tile]').forEach(el=>{
      el.addEventListener('click', ()=>{
        selectedClientId = el.getAttribute('data-client-tile');
        render();
      });
    });

    const activeClientSelect = document.getElementById('activeClientSelect');
    if(activeClientSelect){
      activeClientSelect.addEventListener('change', (e)=>{
        selectedClientId = e.target.value || null;
        render();
      });
    }

    const btnNewClient = document.getElementById('btnNewClient');
    if(btnNewClient) btnNewClient.addEventListener('click', ()=>{
      if(state.segments.length===0){ showToast('Crie um segmento antes de cadastrar um cliente.'); return; }
      modal={type:'newClient'}; renderModal();
    });
    const btnEditClient = document.getElementById('btnEditClient');
    if(btnEditClient) btnEditClient.addEventListener('click', ()=>{ modal={type:'editClient', payload:{clientId:selectedClientId}}; renderModal(); });
    const btnDeleteClient = document.getElementById('btnDeleteClient');
    if(btnDeleteClient) btnDeleteClient.addEventListener('click', ()=>{ modal={type:'confirmDeleteClient', payload:{clientId:selectedClientId}}; renderModal(); });

    // --- Client checklist checkboxes ---
    document.querySelectorAll('[data-check-item]').forEach(cb=>{
      cb.addEventListener('change', async (e)=>{
        const client = getClient(selectedClientId);
        const itemId = e.target.getAttribute('data-check-item');
        const target = e.target.getAttribute('data-check-target');
        const map = target==='config' ? client.checklistConfig : client.checklistTraining;
        map[itemId] = e.target.checked;
        await persist();
        render();
      });
    });

    // --- Expand/collapse a client-facing item with subtítulos ---
    document.querySelectorAll('[data-toggle-tab]').forEach(row=>{
      row.addEventListener('click', ()=>{
        const itemId = row.getAttribute('data-toggle-tab');
        const key = selectedClientId + '|' + itemId;
        if(expandedItems.has(key)) expandedItems.delete(key); else expandedItems.add(key);
        render();
      });
    });

    // --- Subtítulos (manager: expand/edit/add/remove) ---
    document.querySelectorAll('[data-toggle-manager-item]').forEach(el=>{
      el.addEventListener('click', ()=>{
        const itemId = el.getAttribute('data-toggle-manager-item');
        if(expandedManagerItems.has(itemId)) expandedManagerItems.delete(itemId); else expandedManagerItems.add(itemId);
        render();
      });
    });
    document.querySelectorAll('[data-edit-subitem]').forEach(btn=>{
      btn.addEventListener('click', ()=>{ editingSubItemKey = btn.getAttribute('data-edit-subitem'); render(); });
    });
    document.querySelectorAll('[data-cancel-subitem]').forEach(btn=>{
      btn.addEventListener('click', ()=>{ editingSubItemKey = null; render(); });
    });
    document.querySelectorAll('[data-del-subitem]').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        const [itemId, subId] = btn.getAttribute('data-del-subitem').split('|');
        const item = locateItem(itemId);
        if(item){ item.subItems = (item.subItems||[]).filter(si=>si.id!==subId); }
        await persist();
        render();
      });
    });
    async function saveSubItem(key){
      const [itemId, subId] = key.split('|');
      const input = document.querySelector(`[data-edit-subitem-input="${key}"]`);
      const texto = input.value.trim();
      if(!texto){ showToast('O texto não pode ficar vazio.'); return; }
      const item = locateItem(itemId);
      const si = item && (item.subItems||[]).find(s=>s.id===subId);
      if(si) si.texto = texto;
      editingSubItemKey = null;
      await persist();
      render();
    }
    document.querySelectorAll('[data-save-subitem]').forEach(btn=>{
      btn.addEventListener('click', ()=>saveSubItem(btn.getAttribute('data-save-subitem')));
    });
    document.querySelectorAll('[data-edit-subitem-input]').forEach(input=>{
      const key = input.getAttribute('data-edit-subitem-input');
      input.addEventListener('keydown', (e)=>{
        if(e.key==='Enter'){ e.preventDefault(); saveSubItem(key); }
        if(e.key==='Escape'){ e.preventDefault(); editingSubItemKey=null; render(); }
      });
      input.focus(); input.selectionStart = input.selectionEnd = input.value.length;
    });
    document.querySelectorAll('[data-new-subitem-btn]').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        const itemId = btn.getAttribute('data-new-subitem-btn');
        const input = document.querySelector(`[data-new-subitem-input="${itemId}"]`);
        const texto = input.value.trim();
        if(!texto){ showToast('Digite o texto do subtítulo.'); return; }
        const item = locateItem(itemId);
        if(item){ if(!item.subItems) item.subItems = []; item.subItems.push({id: uid('sub'), texto}); }
        await persist();
        render();
      });
    });
    document.querySelectorAll('[data-new-subitem-input]').forEach(input=>{
      input.addEventListener('keydown', (e)=>{
        if(e.key==='Enter'){
          const itemId = input.getAttribute('data-new-subitem-input');
          document.querySelector(`[data-new-subitem-btn="${itemId}"]`).click();
        }
      });
    });

    // --- Standard config items ---
    document.querySelectorAll('[data-edit-std-item]').forEach(btn=>{
      btn.addEventListener('click', ()=>{ editingStdItemKey = btn.getAttribute('data-edit-std-item'); render(); });
    });
    document.querySelectorAll('[data-cancel-std-item]').forEach(btn=>{
      btn.addEventListener('click', ()=>{ editingStdItemKey = null; render(); });
    });
    document.querySelectorAll('[data-del-std-item]').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        const itemId = btn.getAttribute('data-del-std-item');
        state.standardConfig = state.standardConfig.filter(i=>i.id!==itemId);
        await persist();
        render();
      });
    });
    async function saveStdItem(itemId){
      const input = document.querySelector(`[data-edit-std-input="${itemId}"]`);
      const texto = input.value.trim();
      if(!texto){ showToast('O texto não pode ficar vazio.'); return; }
      const item = state.standardConfig.find(i=>i.id===itemId);
      item.texto = texto;
      editingStdItemKey = null;
      await persist();
      render();
    }
    document.querySelectorAll('[data-save-std-item]').forEach(btn=>{
      btn.addEventListener('click', ()=>saveStdItem(btn.getAttribute('data-save-std-item')));
    });
    document.querySelectorAll('[data-edit-std-input]').forEach(input=>{
      const itemId = input.getAttribute('data-edit-std-input');
      input.addEventListener('keydown', (e)=>{
        if(e.key==='Enter'){ e.preventDefault(); saveStdItem(itemId); }
        if(e.key==='Escape'){ e.preventDefault(); editingStdItemKey=null; render(); }
      });
      input.focus(); input.selectionStart = input.selectionEnd = input.value.length;
    });
    const newStdBtn = document.getElementById('newStdItemBtn');
    if(newStdBtn) newStdBtn.addEventListener('click', async ()=>{
      const input = document.getElementById('newStdItemInput');
      const texto = input.value.trim();
      if(!texto){ showToast('Digite o texto do item.'); return; }
      state.standardConfig.push({id: uid('cfg'), texto, subItems:[]});
      await persist();
      render();
    });
    const newStdInput = document.getElementById('newStdItemInput');
    if(newStdInput) newStdInput.addEventListener('keydown', (e)=>{
      if(e.key==='Enter') document.getElementById('newStdItemBtn').click();
    });

    // --- Segment-specific config items ---
    document.querySelectorAll('[data-edit-seg-item]').forEach(btn=>{
      btn.addEventListener('click', ()=>{ editingSegItemKey = btn.getAttribute('data-edit-seg-item'); render(); });
    });
    document.querySelectorAll('[data-cancel-seg-item]').forEach(btn=>{
      btn.addEventListener('click', ()=>{ editingSegItemKey = null; render(); });
    });
    document.querySelectorAll('[data-del-seg-item]').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        const [segId, itemId] = btn.getAttribute('data-del-seg-item').split('|');
        const seg = getSegment(segId);
        seg.extraConfig = seg.extraConfig.filter(i=>i.id!==itemId);
        await persist();
        render();
      });
    });
    async function saveSegItem(key){
      const [segId, itemId] = key.split('|');
      const input = document.querySelector(`[data-edit-seg-input="${key}"]`);
      const texto = input.value.trim();
      if(!texto){ showToast('O texto não pode ficar vazio.'); return; }
      const seg = getSegment(segId);
      const item = seg.extraConfig.find(i=>i.id===itemId);
      item.texto = texto;
      editingSegItemKey = null;
      await persist();
      render();
    }
    document.querySelectorAll('[data-save-seg-item]').forEach(btn=>{
      btn.addEventListener('click', ()=>saveSegItem(btn.getAttribute('data-save-seg-item')));
    });
    document.querySelectorAll('[data-edit-seg-input]').forEach(input=>{
      const key = input.getAttribute('data-edit-seg-input');
      input.addEventListener('keydown', (e)=>{
        if(e.key==='Enter'){ e.preventDefault(); saveSegItem(key); }
        if(e.key==='Escape'){ e.preventDefault(); editingSegItemKey=null; render(); }
      });
      input.focus(); input.selectionStart = input.selectionEnd = input.value.length;
    });
    document.querySelectorAll('[data-new-seg-item-btn]').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        const segId = btn.getAttribute('data-new-seg-item-btn');
        const input = document.querySelector(`[data-new-seg-item-input="${segId}"]`);
        const texto = input.value.trim();
        if(!texto){ showToast('Digite o texto do item.'); return; }
        const seg = getSegment(segId);
        seg.extraConfig.push({id: uid('cfg'), texto, subItems:[]});
        await persist();
        render();
      });
    });
    document.querySelectorAll('[data-new-seg-item-input]').forEach(input=>{
      input.addEventListener('keydown', (e)=>{
        if(e.key==='Enter'){
          const segId = input.getAttribute('data-new-seg-item-input');
          document.querySelector(`[data-new-seg-item-btn="${segId}"]`).click();
        }
      });
    });

    // --- Segment name / delete ---
    document.querySelectorAll('[data-edit-segname]').forEach(btn=>{
      btn.addEventListener('click', ()=>{ editingSegNameKey = btn.getAttribute('data-edit-segname'); render(); });
    });
    document.querySelectorAll('[data-cancel-segname]').forEach(btn=>{
      btn.addEventListener('click', ()=>{ editingSegNameKey = null; render(); });
    });
    async function saveSegName(segId){
      const input = document.querySelector(`[data-edit-segname-input="${segId}"]`);
      const name = input.value.trim();
      if(!name){ showToast('O nome do segmento não pode ficar vazio.'); return; }
      getSegment(segId).name = name;
      editingSegNameKey = null;
      await persist();
      render();
    }
    document.querySelectorAll('[data-save-segname]').forEach(btn=>{
      btn.addEventListener('click', ()=>saveSegName(btn.getAttribute('data-save-segname')));
    });
    document.querySelectorAll('[data-edit-segname-input]').forEach(input=>{
      const segId = input.getAttribute('data-edit-segname-input');
      input.addEventListener('keydown', (e)=>{
        if(e.key==='Enter'){ e.preventDefault(); saveSegName(segId); }
        if(e.key==='Escape'){ e.preventDefault(); editingSegNameKey=null; render(); }
      });
      input.focus(); input.selectionStart = input.selectionEnd = input.value.length;
    });
    document.querySelectorAll('[data-del-segment]').forEach(btn=>{
      btn.addEventListener('click', ()=>{ modal={type:'confirmDeleteSegment', payload:{segId:btn.getAttribute('data-del-segment')}}; renderModal(); });
    });
    const newSegmentBtn = document.getElementById('newSegmentBtn');
    if(newSegmentBtn) newSegmentBtn.addEventListener('click', async ()=>{
      const input = document.getElementById('newSegmentInput');
      const name = input.value.trim();
      if(!name){ showToast('Digite o nome do segmento.'); return; }
      const color = CLIENT_COLORS[state.segments.length % CLIENT_COLORS.length];
      state.segments.push({id: uid('seg'), name, color, extraConfig: []});
      await persist();
      render();
    });
    const newSegmentInput = document.getElementById('newSegmentInput');
    if(newSegmentInput) newSegmentInput.addEventListener('keydown', (e)=>{
      if(e.key==='Enter') document.getElementById('newSegmentBtn').click();
    });

    // --- Training topics ---
    document.querySelectorAll('[data-edit-topic]').forEach(btn=>{
      btn.addEventListener('click', ()=>{ editingTopicKey = btn.getAttribute('data-edit-topic'); render(); });
    });
    document.querySelectorAll('[data-cancel-topic]').forEach(btn=>{
      btn.addEventListener('click', ()=>{ editingTopicKey = null; render(); });
    });
    document.querySelectorAll('[data-del-topic]').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        const [sysId, topicId] = btn.getAttribute('data-del-topic').split('|');
        const sys = getSystem(sysId);
        sys.topics = sys.topics.filter(i=>i.id!==topicId);
        await persist();
        render();
      });
    });
    async function saveTopic(key){
      const [sysId, topicId] = key.split('|');
      const input = document.querySelector(`[data-edit-topic-input="${key}"]`);
      const texto = input.value.trim();
      if(!texto){ showToast('O texto não pode ficar vazio.'); return; }
      const sys = getSystem(sysId);
      const item = sys.topics.find(i=>i.id===topicId);
      item.texto = texto;
      editingTopicKey = null;
      await persist();
      render();
    }
    document.querySelectorAll('[data-save-topic]').forEach(btn=>{
      btn.addEventListener('click', ()=>saveTopic(btn.getAttribute('data-save-topic')));
    });
    document.querySelectorAll('[data-edit-topic-input]').forEach(input=>{
      const key = input.getAttribute('data-edit-topic-input');
      input.addEventListener('keydown', (e)=>{
        if(e.key==='Enter'){ e.preventDefault(); saveTopic(key); }
        if(e.key==='Escape'){ e.preventDefault(); editingTopicKey=null; render(); }
      });
      input.focus(); input.selectionStart = input.selectionEnd = input.value.length;
    });
    document.querySelectorAll('[data-new-topic-btn]').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        const sysId = btn.getAttribute('data-new-topic-btn');
        const input = document.querySelector(`[data-new-topic-input="${sysId}"]`);
        const texto = input.value.trim();
        if(!texto){ showToast('Digite o texto do tópico.'); return; }
        const sys = getSystem(sysId);
        sys.topics.push({id: uid('top'), texto, subItems:[]});
        await persist();
        render();
      });
    });
    document.querySelectorAll('[data-new-topic-input]').forEach(input=>{
      input.addEventListener('keydown', (e)=>{
        if(e.key==='Enter'){
          const sysId = input.getAttribute('data-new-topic-input');
          document.querySelector(`[data-new-topic-btn="${sysId}"]`).click();
        }
      });
    });

    // --- System name / delete ---
    document.querySelectorAll('[data-edit-sysname]').forEach(btn=>{
      btn.addEventListener('click', ()=>{ editingSystemNameKey = btn.getAttribute('data-edit-sysname'); render(); });
    });
    document.querySelectorAll('[data-cancel-sysname]').forEach(btn=>{
      btn.addEventListener('click', ()=>{ editingSystemNameKey = null; render(); });
    });
    async function saveSysName(sysId){
      const input = document.querySelector(`[data-edit-sysname-input="${sysId}"]`);
      const name = input.value.trim();
      if(!name){ showToast('O nome do sistema não pode ficar vazio.'); return; }
      getSystem(sysId).name = name;
      editingSystemNameKey = null;
      await persist();
      render();
    }
    document.querySelectorAll('[data-save-sysname]').forEach(btn=>{
      btn.addEventListener('click', ()=>saveSysName(btn.getAttribute('data-save-sysname')));
    });
    document.querySelectorAll('[data-edit-sysname-input]').forEach(input=>{
      const sysId = input.getAttribute('data-edit-sysname-input');
      input.addEventListener('keydown', (e)=>{
        if(e.key==='Enter'){ e.preventDefault(); saveSysName(sysId); }
        if(e.key==='Escape'){ e.preventDefault(); editingSystemNameKey=null; render(); }
      });
      input.focus(); input.selectionStart = input.selectionEnd = input.value.length;
    });
    document.querySelectorAll('[data-del-system]').forEach(btn=>{
      btn.addEventListener('click', ()=>{ modal={type:'confirmDeleteSystem', payload:{sysId:btn.getAttribute('data-del-system')}}; renderModal(); });
    });
    const newSystemBtn = document.getElementById('newSystemBtn');
    if(newSystemBtn) newSystemBtn.addEventListener('click', async ()=>{
      const input = document.getElementById('newSystemInput');
      const name = input.value.trim();
      if(!name){ showToast('Digite o nome do sistema.'); return; }
      state.systems.push({id: uid('sys'), name, topics: []});
      await persist();
      render();
    });
    const newSystemInput = document.getElementById('newSystemInput');
    if(newSystemInput) newSystemInput.addEventListener('keydown', (e)=>{
      if(e.key==='Enter') document.getElementById('newSystemBtn').click();
    });
  }

  loadData();
})();
</script>
</body>
</html>
